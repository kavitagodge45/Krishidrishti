# ==============================================================================
# KRISHIDRISHTI — RENDER BLUEPRINT CONFIGURATION
# Deploys both Backend Web Service and Frontend Static Site together.
# Docs: https://render.com/docs/blueprint-spec
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Backend Web Service (Node.js + Express API)
  # ----------------------------------------------------------------------------
  - type: web
    name: krishidrishti-server
    runtime: node
    plan: free
    region: oregon
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: node dist/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: https://krishidrishti-dwzz.onrender.com
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: DATA_GOV_IN_API_KEY
        sync: false

  # ----------------------------------------------------------------------------
  # 2. Frontend Static Site (Vite + React)
  # ----------------------------------------------------------------------------
  - type: web
    name: krishidrishti-client
    runtime: static
    plan: free
    region: oregon
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_API_URL
        fromService:
          type: web
          name: krishidrishti-server
          property: host
